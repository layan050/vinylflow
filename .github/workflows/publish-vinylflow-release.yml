name: Publish VinylFlow APKs

on:
  push:
    tags:
      - v1.2.0

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged APKs
        uses: actions/checkout@v4

      - name: Publish all device APKs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" dist/*.apk \
            --title "VinylFlow $RELEASE_TAG" \
            --notes "VinylFlow 1.2.0 adds three home-screen widget styles (Mini Violet, Player Cream, and Silver Turntable), adjustable launcher sizes, and a spinning vinyl. The phone and tablet player now follows the supplied turntable references."
          assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          printf '%s\n' "$assets"
          count="$(printf '%s\n' "$assets" | sed '/^$/d' | wc -l)"
          test "$count" -eq 5
