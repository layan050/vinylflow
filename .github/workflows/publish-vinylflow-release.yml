name: Publish VinylFlow APKs

on:
  push:
    tags:
      - v1.4.0

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged APKs
        uses: actions/checkout@v4

      - name: Publish all device APKs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" dist/*.apk \
            --title "VinylFlow $RELEASE_TAG" \
            --notes "VinylFlow 1.4.0 adds an album-art turntable player with song and artist details on the record label, plus resizable iPod and cassette tape home-screen widgets. Includes universal and device-specific APKs for ARM and x86 Android devices."
          assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          printf '%s\n' "$assets"
          count="$(printf '%s\n' "$assets" | sed '/^$/d' | wc -l)"
          test "$count" -eq 5
